name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build MCP server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mcp-web-reader

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-web-reader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build
        run: npm run build