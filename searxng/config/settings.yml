use_default_settings:
  engines:
    keep_only:
      - bing
      - duckduckgo
      - wikipedia

server:
  secret_key: "this-is-a-long-random-string-for-ai-configuration"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

engines:
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: wikipedia
    disabled: false
