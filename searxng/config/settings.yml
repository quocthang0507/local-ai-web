use_default_settings:
  engines:
    remove:
      - ahmia
      - torch
      - wikidata

server:
  secret_key: "this-is-a-long-random-string-for-ai-configuration"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

engines:
  - name: karmasearch
    disabled: true
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: false
  - name: startpage
    disabled: true